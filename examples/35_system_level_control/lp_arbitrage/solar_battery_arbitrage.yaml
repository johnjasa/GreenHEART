name: H2Integrate_config
system_summary: >
  A merchant battery added to an existing solar plant in west Texas that
  arbitrages an hourly locational marginal price series. A rolling-horizon
  linear program at the system level co-optimizes battery charge/discharge,
  grid imports, and grid exports, and an outer parameter sweep traces the net
  present value of the addition against battery energy capacity.
driver_config: driver_config.yaml
plant_config: plant_config.yaml
technology_config: tech_config.yaml
